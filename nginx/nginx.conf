worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log which upstream instance served each request — proves that traffic
    # is balanced across the FastAPI instances.
    log_format lb '$remote_addr -> upstream=$upstream_addr '
                  'status=$status "$request" rt=$request_time';
    access_log /var/log/nginx/access.log lb;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS. Resolving the service name at request time means
    # newly scaled instances (docker compose up --scale api=N) are picked up
    # automatically without reloading Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream crm_api {
        # 'api' is the compose service name; Docker DNS returns all replica IPs.
        # least_conn spreads load by active connections (good under bursts).
        zone crm_api 64k;
        least_conn;
        server api:8000 resolve max_fails=2 fail_timeout=5s;
    }

    # Control plane (scaling). Single instance, resolved via Docker DNS.
    upstream crm_controller {
        zone crm_controller 32k;
        server controller:9000 resolve max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---- Custom branded error pages ----
        error_page 404 /error-pages/404.html;
        error_page 500 502 503 504 /error-pages/50x.html;

        location ^~ /error-pages/ {
            internal;
            root /usr/share/nginx/html;
        }

        # Health endpoint for the load balancer itself.
        location = /lb-health {
            access_log off;
            return 200 'lb-ok';
            add_header Content-Type text/plain;
        }

        # ---- Control plane: scaling endpoints routed to the controller ----
        location /api/control/ {
            proxy_pass http://crm_controller;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_intercept_errors on;
            error_page 502 503 504 /error-pages/50x.html;
        }

        # ---- API: load balanced across FastAPI instances ----
        location /api/ {
            proxy_pass http://crm_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            # Only intercept "backend unavailable" errors so a branded page is
            # shown when all instances are down/overloaded. Defining error_page
            # here overrides the inherited 404/500 rules, so genuine API
            # responses (404 not-found JSON, 401, 500) still pass through intact.
            proxy_intercept_errors on;
            error_page 502 503 504 /error-pages/50x.html;
            # Surface which backend instance served the request to the browser.
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Zone;
        }

        # ---- Static assets: return a real 404 (don't fall back to the SPA) ----
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map)$ {
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        # ---- Vue SPA: history-mode fallback for app routes ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
