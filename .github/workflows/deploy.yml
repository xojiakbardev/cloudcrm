name: Deploy

# Deploys to the production server after CI passes on main.
# Requires these repository secrets:
#   SERVER_HOST      - server IP or hostname
#   SERVER_USER      - SSH user
#   SERVER_SSH_KEY   - private SSH key (PEM)
#   SERVER_PORT      - SSH port (optional, default 22)
#
# The JWT signing key lives in ~/cloudcrm/.env on the server (generated
# automatically on first deploy, reused on every subsequent deploy so
# existing user sessions keep working).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build & push controller (autoscaler)
        uses: docker/build-push-action@v6
        with:
          context: ./controller
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-controller:latest
            ${{ env.IMAGE_PREFIX }}-controller:${{ github.sha }}

      - name: Build & push nginx (SPA + load balancer)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nginx:latest
            ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "~/cloudcrm"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd ~/cloudcrm
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Generate the JWT signing key once and reuse it across deploys.
            if [ ! -f .env ]; then
              {
                echo "IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}"
                echo "SECRET_KEY=$(openssl rand -hex 32)"
              } > .env
              chmod 600 .env
            else
              grep -q '^IMAGE_PREFIX=' .env || echo "IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}" >> .env
            fi

            # Free disk before the pull so a slow link doesn't fill /var/lib/docker.
            docker image prune -af --filter "until=1h" || true

            # Pull only the images we ship — postgres uses its cached copy if
            # already present, so we don't redownload it on every deploy.
            docker compose --env-file .env -f docker-compose.prod.yml pull api controller nginx

            docker compose --env-file .env -f docker-compose.prod.yml up -d --scale api=3 --remove-orphans

            # Drop every image not currently used by a running container
            # (old GHCR builds, dangling layers, anything left over).
            docker image prune -af
