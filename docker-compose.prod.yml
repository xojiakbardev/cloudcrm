# Production stack — pulls pre-built images from GHCR (set by CI/CD).
# A single Nginx image serves the Vue SPA and load balances the API tier.
# Usage on the server (env vars come from ~/cloudcrm/.env):
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --scale api=3
name: cloudcrm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX}-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY missing — populate .env on the server (deploy workflow generates it on first run)}
      INSTANCE_ZONE: az-a
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_net
    expose:
      - "8000"
    restart: unless-stopped

  controller:
    # Control plane — scales the API tier through the Docker Engine API and
    # serves /api/control/* via the Nginx load balancer.
    image: ${IMAGE_PREFIX}-controller:latest
    environment:
      COMPOSE_PROJECT_NAME: cloudcrm
      API_SERVICE: api
      API_NETWORK: cloudcrm_private_net
      DATABASE_URL: postgresql+psycopg2://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      SECRET_KEY: ${SECRET_KEY}
      MIN_INSTANCES: "1"
      MAX_INSTANCES: "6"
      COOLDOWN_SECONDS: "15"
      TARGET_RPS_HIGH: "8"
      TARGET_RPS_LOW: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_net
    expose:
      - "9000"
    restart: unless-stopped

  nginx:
    # Single Nginx: serves the built Vue SPA and load balances the API tier.
    image: ${IMAGE_PREFIX}-nginx:latest
    ports:
      - "80:80"
    depends_on:
      - api
      - controller
    networks:
      - private_net
      - public_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge

volumes:
  db_data:
